# Logrotate config for Indicator Engine
# Deploy to: /etc/logrotate.d/indicator-engine
# Logrotate runs daily via cron; this is a safety net on top of
# Python's RotatingFileHandler which already enforces the 5 MB limit.

/opt/indicator/logs/*.log {
    # Rotate when file reaches 5 MB
    size 5M

    # Keep at most 3 rotated copies (15 MB total including active log)
    rotate 3

    # Compress rotated files to save disk
    compress
    delaycompress

    # No error if log file is missing on first run
    missingok

    # Skip rotation if the log is empty
    notifempty

    # Truncate original after copying (safe -- Python handler will reopen it)
    copytruncate

    # New log file permissions
    create 640 indicator indicator
}
